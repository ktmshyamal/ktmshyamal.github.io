name: Sync Behance projects

on:
  schedule:
    - cron: '17 1 * * *'   # every day at 06:47 Sri Lanka time
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-behance
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for cover images)
        run: pip install --quiet pillow

      - name: Check Behance for new projects
        run: python scripts/sync_behance.py

      - name: Publish changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No new projects."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html assets/work
          git commit -m "Add new Behance projects"
          git push
          # Pushes made by this workflow do not start a Pages build on their own, so ask for one.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
