<html lang="en">
<head>

<style>
/* Layout: slim side rail (tabs on phones) + one working pane. Pipeline of project columns, invoice list beside an editor. */
:root {
  --bg: #f3f4f4;
  --surface: #ffffff;
  --surface-2: #e9ecec;
  --fg: #181b1c;
  --muted: #5e6668;
  --line: #d9dddd;
  --accent: #c94700;
  --accent-fg: #ffffff;
  --accent-soft: #fde7da;
  --good: #1d7a46;
  --good-soft: #d9efe2;
  --warn: #9a6200;
  --warn-soft: #f7e8c8;
  --bad: #b3261e;
  --bad-soft: #f8dcd9;
  --blue: #0a76b4; --blue-soft: #d6ecfa; --blue-tint: #eef7fd; --blue-fg: #ffffff; --blue-line: #b9dcf2;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121516; --surface: #1b1f20; --surface-2: #252a2b; --fg: #eceeee; --muted: #9aa3a5;
    --line: #333a3c; --accent: #ff8a3d; --accent-fg: #1c0b00; --accent-soft: #3a2312;
    --good: #5fcf8f; --good-soft: #17352a; --warn: #e8b24a; --warn-soft: #3a2e12;
    --bad: #ff8d84; --bad-soft: #3e1f1d; --blue: #6cc4f5; --blue-soft: #173c55; --blue-tint: #10283a; --blue-fg: #04141f; --blue-line: #24506e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121516; --surface: #1b1f20; --surface-2: #252a2b; --fg: #eceeee; --muted: #9aa3a5;
  --line: #333a3c; --accent: #ff8a3d; --accent-fg: #1c0b00; --accent-soft: #3a2312;
  --good: #5fcf8f; --good-soft: #17352a; --warn: #e8b24a; --warn-soft: #3a2e12;
  --bad: #ff8d84; --bad-soft: #3e1f1d; --blue: #6cc4f5; --blue-soft: #173c55; --blue-tint: #10283a; --blue-fg: #04141f; --blue-line: #24506e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font-body);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 28px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; gap: 12px; align-items: center; }
.brand .logo { width: 44px; height: 44px; flex: none; }
.brand h1 { font-size: 20px; line-height: 1.1; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.tabs { display: flex; flex-direction: column; gap: 4px; }
.tab { text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.tab .count { float: right; font-family: var(--font-mono); font-size: 12px; opacity: 0.8; }
.syncnote { font-size: 12px; color: var(--muted); line-height: 1.4; }

.pane { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.pane[hidden] { display: none !important; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.bar h2 { font-size: 28px; }
.bar .sub { color: var(--muted); margin: 2px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: none; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.stat .v { font: 500 22px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.stat.attn .v { color: var(--bad); }

.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.col { background: var(--surface-2); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
.col > header { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 2px 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card .t { font-weight: 600; overflow-wrap: anywhere; }
.card .c { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.card .m { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.card .m .mono { color: var(--fg); }
.empty { color: var(--muted); font-size: 13px; padding: 6px 4px; }

.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }

.split { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; align-items: start; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; }
.row:hover, .row[aria-current="true"] { border-color: var(--accent); }
.row .a { font-weight: 600; overflow-wrap: anywhere; }
.row .b { color: var(--muted); font-size: 13px; }
.row .r { text-align: right; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.wide { grid-column: 1 / -1; }
.f label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.f input, .f select, .f textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
.f textarea { min-height: 68px; resize: vertical; }

.items { width: 100%; border-collapse: collapse; }
.tablewrap { overflow-x: auto; }
.items th { text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; padding: 4px 6px; font-weight: 500; }
.items td { padding: 4px 6px; vertical-align: top; }
.items input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; width: 100%; }
.items .q { width: 70px; } .items .p { width: 110px; } .items .tot { text-align: right; white-space: nowrap; padding-top: 11px; }
.totals { margin-left: auto; display: grid; grid-template-columns: auto auto; gap: 4px 24px; justify-items: end; }
.totals .grand { font-weight: 600; font-size: 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .spacer { flex: 1; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 8px 12px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 14px; z-index: 20; }
.svc { display: grid; grid-template-columns: minmax(0, 1fr) 110px 90px auto; gap: 8px; align-items: center; }
.svc input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; width: 100%; min-width: 0; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rail { position: static; gap: 12px; }
  .tabs { flex-direction: row; overflow-x: auto; }
  .tab { white-space: nowrap; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .bar h2 { font-size: 24px; }
  .svc { grid-template-columns: minmax(0, 1fr) 90px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .row, .btn, .tab { transition: border-color 0.12s, background 0.12s; }
}

.muted { color: var(--muted); font-size: 13px; }
.sr { position: absolute; left: -9999px; }
.est { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.est-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.est-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.searchrow input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; font-weight: 500; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.cat { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.cat h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 4px 2px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto 104px; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.srow.on { border-color: var(--accent); background: var(--accent-soft); }
.sname { overflow-wrap: anywhere; font-weight: 500; }
.sname small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.sprice { white-space: nowrap; font-size: 14px; }
.sctl { display: flex; justify-content: flex-end; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; background: var(--surface); }
.step button { background: none; border: 0; width: 32px; height: 30px; font-size: 18px; line-height: 1; color: var(--accent); }
.step button:hover { background: var(--accent-soft); }
.step span { min-width: 26px; text-align: center; font-size: 14px; }
.eline { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.eline .en { font-size: 14px; overflow-wrap: anywhere; }
.eline .ec { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.why { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
.why b { color: var(--fg); font-weight: 600; }
.grp { margin: 10px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.estbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; display: none; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.estbar .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.estbar .v { font-size: 20px; font-weight: 500; }
@media (max-width: 900px) { .est { grid-template-columns: minmax(0, 1fr); } .est-side { position: static; } }
@media (max-width: 760px) {
  .estbar:not([hidden]) { display: flex; }
  body.has-bar { padding-bottom: 96px; }
  .srow { grid-template-columns: minmax(0, 1fr) 104px; }
  .srow .sprice { grid-column: 1; grid-row: 2; color: var(--muted); }
  .srow .sctl { grid-column: 2; grid-row: 1 / span 2; }
}
.fu { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.fu:first-child { border-top: 0; }
.fu-main { min-width: 0; flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.fu-t { font-weight: 600; overflow-wrap: anywhere; }
.fu .b { color: var(--muted); font-size: 13px; }
.fu-act { display: flex; gap: 8px; align-items: flex-start; }
.fu details { font-size: 13px; margin-top: 4px; }
.fu summary { cursor: pointer; color: var(--accent); }
.fumsg { margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 6px; overflow-wrap: anywhere; }
.banner.ok { background: var(--good-soft); color: var(--good); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg.wide { align-self: flex-start; }
.seg button { border: 0; background: none; padding: 8px 16px; font-weight: 500; color: var(--muted); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.intl { --accent: var(--blue); --accent-soft: var(--blue-soft); --accent-fg: var(--blue-fg); --line: var(--blue-line); }
.intl .srow, .intl .panel, .intl .pkg, .intl .step, .intl .note, .intl .seg, .intl .chip { background: var(--blue-tint); }
.intl .srow.on, .intl .pkg.on { background: var(--blue-soft); }
.intl .chip[aria-pressed="true"], .intl .seg button[aria-pressed="true"] { background: var(--blue); color: var(--blue-fg); }
.pill.intl { background: var(--blue-soft); color: var(--blue); }
.note { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.note summary { cursor: pointer; font-weight: 500; }
.note a { color: var(--accent); }
.refs { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.pkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pkg { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pkg.on { border-color: var(--accent); background: var(--accent-soft); }
.pkg header { display: flex; flex-direction: column; gap: 2px; }
.pkg h3 { font-size: 17px; }
.pk-price { font-size: 20px; font-weight: 500; }
.pkg ul { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.pk-save { font-size: 13px; color: var(--good); }
.pk-ref { font-size: 12px; color: var(--muted); line-height: 1.4; }
.pkg .sctl { margin-top: auto; justify-content: flex-start; }
.svc { grid-template-columns: minmax(0, 1fr) 100px 90px 140px auto; }
.svc.head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
@media (max-width: 760px) {
  .svc { grid-template-columns: minmax(0, 1fr) 90px 80px; }
  .svc.head { display: none; }
  .seg { width: 100%; } .seg button { flex: 1; padding: 8px 6px; }
}
a.btn { text-decoration: none; display: inline-block; color: inherit; }
a.btn.primary { color: var(--accent-fg); }
.pays { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.pay { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.pay:first-of-type { border-top: 0; }
.payform { display: grid; grid-template-columns: 140px 160px minmax(0, 1fr); gap: 8px; }
@media (max-width: 760px) { .payform { grid-template-columns: minmax(0, 1fr); } }
.cal-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.cal-head h3 { font-size: 20px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; text-align: center; padding: 2px 0; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-height: 84px; padding: 4px; display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: left; min-width: 0; overflow: hidden; }
.day:hover, .day[aria-current="true"] { border-color: var(--accent); }
.day.out { opacity: 0.45; }
.day .n { font: 500 12px var(--font-mono); color: var(--muted); }
.day.today .n { background: var(--accent); color: var(--accent-fg); border-radius: 99px; padding: 0 6px; align-self: flex-start; }
.chipwrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chipc { font-size: 11px; line-height: 1.25; padding: 1px 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.chipc[data-p="TikTok"], .chipc[data-p="YouTube"] { background: var(--surface-2); color: var(--fg); }
.chipc[data-done="1"] { text-decoration: line-through; opacity: 0.65; }
.chipc.due { background: var(--warn-soft); color: var(--warn); }
.day .more { font-size: 11px; color: var(--muted); }
.sug { border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 760px) {
  .day { min-height: 56px; padding: 3px; }
  .chipc { font-size: 0; height: 6px; padding: 0; }
  .chipc.due { height: 6px; }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <img class="logo" id="brandLogo" alt="" width="44" height="44">
      <div><h1 id="brandName">Creator Hub</h1><p>Clients · Quotes · Invoices</p></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-estimate" data-tab="estimate" aria-selected="true">Estimate</button>
      <button class="tab" role="tab" id="tab-pipeline" data-tab="pipeline" aria-selected="false">Projects <span class="count" id="cnt-pipeline"></span></button>
      <button class="tab" role="tab" id="tab-calendar" data-tab="calendar" aria-selected="false">Calendar</button>
      <button class="tab" role="tab" id="tab-clients" data-tab="clients" aria-selected="false">Clients</button>
      <button class="tab" role="tab" id="tab-invoices" data-tab="invoices" aria-selected="false">Invoices <span class="count" id="cnt-invoices"></span></button>
      <button class="tab" role="tab" id="tab-settings" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
    <div class="syncnote" id="syncNote">Loading your data…</div>
  </aside>

  <main>
    <section class="pane" id="pane-estimate" aria-labelledby="tab-estimate"></section>
    <section class="pane" id="pane-pipeline" aria-labelledby="tab-pipeline" hidden></section>
    <section class="pane" id="pane-calendar" aria-labelledby="tab-calendar" hidden></section>
    <section class="pane" id="pane-clients" aria-labelledby="tab-clients" hidden></section>
    <section class="pane" id="pane-invoices" aria-labelledby="tab-invoices" hidden></section>
    <section class="pane" id="pane-settings" aria-labelledby="tab-settings" hidden></section>
  </main>
</div>

  PACKAGES.forEach((p, i) => out.push({
    id: "pk" + i, cat: "Packages", pkg: true, name: p.name, rate: p.rate, usd: toUsd(p.rate), note: "",
    lines: p.lines, inc: p.lines.map(([n, q]) => q + " × " + n).concat(p.extra), refLocal: p.refLocal, refIntl: p.refIntl,
  }));
  return out;
}
const svcRate = (name) => (rateCardServices().find((s) => s.name === name) || { rate: 0 }).rate;

/* Keep anything the user edited; add new fields and new items. */
function mergeRateCard(existing) {
  const fresh = rateCardServices();
  const merged = fresh.map((f) => {
    const e = existing.find((x) => x.name === f.name);
    return e ? { ...f, id: e.id, rate: e.rate, usd: e.usd != null ? e.usd : f.usd, cat: f.pkg ? "Packages" : (e.cat || f.cat) } : f;
  });
  return merged.concat(existing.filter((e) => !fresh.some((f) => f.name === e.name)));
}

const LS_KEY = "creator-hub-v1";
function lsRead() { try { const v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsWrite(json) { try { localStorage.setItem(LS_KEY, json); } catch (e) { /* storage may be blocked */ } }

function adopt(data) {
  if (!data || !data.settings) return false;
  state = data;
  if (!Array.isArray(state.projects)) state.projects = [];
  if (!Array.isArray(state.invoices)) state.invoices = [];
  if (!Array.isArray(state.settings.services)) state.settings.services = [];
  if (!state.settings.rateCardV) {
    state.settings.services = rateCardServices();
    if (!state.settings.brand || state.settings.brand === "Your Studio Name") state.settings.brand = "Artslab Creatives";
    state.settings.rateCardV = 2;
  } else if (state.settings.rateCardV < 2) {
    state.settings.services = mergeRateCard(state.settings.services); state.settings.rateCardV = 2;
  }
  state.estimate = Object.assign(newEstimate(), state.estimate || {});
  if (!state.estimate.qty) state.estimate.qty = {};
  const S = state.settings;
  if (S.paymentInfo == null) S.paymentInfo = "";
  if (S.depositPct == null) S.depositPct = 50;
  if (!S.validUntil) S.validUntil = "31 Dec 2026";
  if (!Array.isArray(state.clients)) state.clients = [];
  if (!Array.isArray(state.posts)) state.posts = [];
  return true;
}

async function initStore() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (db) {
    try {
      store.mode = "db";
      store.doc = db.doc("hub/state");
      await new Promise((resolve) => {
        let first = true;
        store.doc.onSnapshot((snap) => {
          const d = snap.exists ? snap.data() : null;
          const incoming = d && d.json ? d.json : "";
          if (first) {
            first = false;
            if (incoming) { try { adopt(JSON.parse(incoming)); store.lastJson = incoming; } catch (e) { /* ignore bad data */ } }
            resolve();
          } else if (incoming && incoming !== store.lastJson && !snap.metadata.hasPendingWrites && !store.busy && !store.dirty) {
            try { adopt(JSON.parse(incoming)); store.lastJson = incoming; renderAll(); } catch (e) { /* ignore */ }
          }
        }, () => { store.mode = "local"; if (first) { first = false; resolve(); } });
      });
      setNote("Saved to your account. Open this page on any device to see the same data.");
    } catch (e) { store.mode = "local"; }
  }
  if (store.mode !== "db") {
    store.mode = "local";
    const saved = lsRead();
    if (saved) adopt(saved);
    setNote(window.claude ? "Saved in this browser only. Sign in to claude.ai to keep it across devices." : "Saved on this device only. Use Settings > Save backup.");
  }
  if (!state) state = exampleState();
}

function save() {
  clearTimeout(store.timer);
  store.dirty = true;
  store.timer = setTimeout(flush, 350);
}
async function flush() {
  store.dirty = false;
  if (store.busy) { store.again = true; return; }
  store.busy = true;
  const json = JSON.stringify(state);
  try {
    lsWrite(json);
    if (store.mode === "db" && store.doc) { await store.doc.set({ json }); store.lastJson = json; }
  } catch (e) {
    setNote("Could not save to your account. Changes are kept in this browser.");
  }
  store.busy = false;
  if (store.again) { store.again = false; flush(); }
}

      `You help a creative studio price a job from its rate card. Pick the services or packages that fit this client brief.\n\nBRIEF:\n${text}\n\nRATE CARD (id | name | price):\n${catalog}\n\nReturn ONLY a JSON array, at most 10 items, each {"id": string from the rate card, "qty": whole number 1-50, "reason": short sentence}. Use only ids from the rate card. Prefer a package when it covers most of the brief, and do not also add the items it already contains. Pick the closest tier (for example video length). Do not invent services.`,
      { modelTier: "quick" });
    const picks = (Array.isArray(out) ? out : []).filter((p) => p && svcById(p.id));
    if (!picks.length) { msg.textContent = "No match found. Try adding more detail."; }
    else {
      picks.forEach((p) => { estQty()[p.id] = Math.min(50, Math.max(1, Math.round(num(p.qty)) || 1)); });
      save(); renderEstimate();
      why.innerHTML = '<ul class="why">' + picks.map((p) => `<li><b>${esc(svcById(p.id).name)}</b> — ${esc(p.reason || "")}</li>`).join("") + "</ul>";
      msg.textContent = "Added to your estimate. Adjust anything you like.";
    }
  } catch (e) {
    msg.textContent = e && e.code === "not_granted" ? "Suggestions need your permission to run." : "Could not get suggestions. Pick services by hand.";
  }
  $("#briefGo").disabled = false;
}

function wireEstimate() {
  const pane = $("#pane-estimate");
  pane.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "priceListBtn") return savePriceList();
    if (b.dataset.mkt) { state.estimate.market = b.dataset.mkt; save(); renderEstimate(); return; }
    if (b.dataset.view) { ui.view = b.dataset.view; renderEstimate(); return; }
    if (b.dataset.q) {
      const id = b.dataset.id; const n = Math.max(0, (estQty()[id] || 0) + (+b.dataset.q));
      if (n) estQty()[id] = n; else delete estQty()[id];
      save(); renderEstimate(); return;
    }
    if (b.dataset.cat) { ui.cat = b.dataset.cat; renderChips(); renderCatalog(); return; }
    if (b.id === "briefGo") return suggestServices();
    if (b.id === "estReview") return $("#estPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    const a = b.dataset.est; if (!a) return;
    if (a === "clear") {
      state.estimate = Object.assign(newEstimate(), { market: state.estimate.market }); save();
      $("#estClient").value = ""; $("#briefWhy").innerHTML = ""; renderEstimate(); return;
    }
    if (!estLines().length) { toast("Add at least one service first."); return; }
    createDoc(a, { client: state.estimate.client, items: estToItems(), discount: discNow(), currency: curNow() });
    toast(a === "quote" ? "Quote created. You can still edit it." : "Invoice created. You can still edit it.");

    if (t.id === "svcSearch") { ui.q = t.value; renderCatalog(); }

  });
}

function wirePipeline() {

/* ---------- follow-ups: things to chase, each with a message ready to copy ---------- */
function followUps() {
  const t = todayISO(), out = [], brand = state.settings.brand || "";
  const gap = (iso) => Math.round((new Date(t + "T00:00:00") - new Date(iso + "T00:00:00")) / 86400000);
  const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
  const who = (n) => String(n || "there").replace(/^Example · /, "");
  state.invoices.forEach((i) => {
    const no = docNo(i.kind, i.no);
    if (i.kind === "invoice" && i.status === "sent" && i.due && i.due < t) {
      const d = gap(i.due);
      out.push({ rank: 0, sev: "bad", label: "Overdue", title: `${no} · ${i.client || "No client"}`, sub: `${plural(d, "day")} late · ${dm(i, invBal(i), 2)} due`, doc: i.id, client: i.client,
        msg: `Hi ${who(i.client)}, a friendly reminder that invoice ${no} for ${dm(i, invBal(i), 2)} was due on ${fmtDate(i.due)}. Could you let me know when I can expect payment? Thank you!\n${brand}` });
    }
    if (i.kind === "quote" && i.status === "sent" && i.date && gap(i.date) >= 3) {
      out.push({ rank: 2, sev: "info", label: "Quote", title: `${no} · ${i.client || "No client"}`, sub: `Sent ${plural(gap(i.date), "day")} ago · ${dm(i, invGrand(i), 2)}`, doc: i.id, client: i.client,
        msg: `Hi ${who(i.client)}, I wanted to check if you had a chance to look at quote ${no} (${dm(i, invGrand(i), 2)}). Happy to adjust anything or answer questions. Looking forward to working together!\n${brand}` });
    }
  });
  state.projects.forEach((p) => {
    const active = ["inquiry", "quoted", "shooting", "editing"].includes(p.status);
    const name = p.title || "Untitled project";
    if (active && p.due && p.due < t) {
      out.push({ rank: 0, sev: "bad", label: "Late", title: `${name} · ${p.client || "No client"}`, sub: `Deadline passed ${plural(gap(p.due), "day")} ago`, proj: p.id, client: p.client,
        msg: `Hi ${who(p.client)}, a quick update on "${name}". I'm finishing the last parts and will send it over shortly. Thank you for your patience!\n${brand}` });
    } else if (active && p.due && p.due <= addDays(3)) {
      const d = -gap(p.due);
      out.push({ rank: 1, sev: "warn", label: "Due soon", title: `${name} · ${p.client || "No client"}`, sub: d <= 0 ? "Due today" : `Due in ${plural(d, "day")}`, proj: p.id, client: p.client, msg: "" });
    }
    if (p.status === "delivered" && !state.invoices.some((i) => i.kind === "invoice" && (i.projectId === p.id || (i.client && i.client === p.client)))) {
      out.push({ rank: 1, sev: "warn", label: "No invoice", title: `${name} · ${p.client || "No client"}`, sub: "Delivered, but no invoice made yet", proj: p.id, client: p.client, msg: "" });
    }
  });
  return out.sort((a, b) => a.rank - b.rank);
}

function renderFollowUps() {
  const host = $("#followups"); if (!host) return;
  const list = ui.fu = followUps();
  if (!list.length) { host.innerHTML = '<div class="banner ok">Nothing to chase today. Overdue invoices, unanswered quotes and close deadlines will show up here.</div>'; return; }
  host.innerHTML = `<div class="panel"><h3>Follow-ups <span class="mono">${list.length}</span></h3><div class="list">${list.map((f, n) => `
    <div class="fu">
      <div class="fu-main"><span class="pill ${f.sev}">${esc(f.label)}</span><div class="fu-t">${esc(f.title)}</div><div class="b">${esc(f.sub)}</div>
        ${f.msg ? `<details><summary>Message</summary><div class="fumsg">${esc(f.msg).replace(/\n/g, "<br>")}</div></details>` : ""}</div>
      <div class="fu-act">${f.msg && waLink((clientByName(f.client) || {}).phone, f.msg) ? `<a class="btn small primary" href="${esc(waLink((clientByName(f.client) || {}).phone, f.msg))}" target="_blank" rel="noopener">WhatsApp</a>` : ""}${f.msg ? `<button class="btn small" data-fu-copy="${n}">Copy message</button>` : ""}<button class="btn small" data-fu-open="${n}">Open</button></div>
    </div>`).join("")}</div></div>`;
}

const PLATFORMS = ["Instagram", "Facebook", "TikTok", "YouTube", "LinkedIn", "Other"];
const FORMATS = ["Post", "Carousel", "Reel", "Story", "Video", "Shoot"];
const POST_STATUS = [["idea", "Idea"], ["planned", "Planned"], ["shot", "Shot"], ["edited", "Edited"], ["scheduled", "Scheduled"], ["posted", "Posted"]];
const POST_PILL = { idea: "", planned: "info", shot: "warn", edited: "warn", scheduled: "info", posted: "good" };

const monthStart = (iso) => iso.slice(0, 7) + "-01";
const shiftMonth = (iso, k) => isoLocal(new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1 + k, 1));
const monthLabel = (iso) => new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
const activeDeadline = (p) => p.due && p.status !== "paid";

const postRow = (p) => `<button class="row" data-post="${esc(p.id)}" ${ui.postId === p.id ? 'aria-current="true"' : ""}>
  <span class="a">${esc(p.title || "Untitled post")}</span><span class="r"><span class="pill ${POST_PILL[p.status] || ""}">${esc(postStatusLabel(p.status))}</span></span>

function renderCalendar() {
  if (!$("#calGrid")) return;
  const today = todayISO(), ms = ui.calMonth, y = +ms.slice(0, 4), m = +ms.slice(5, 7) - 1;
  const posts = state.posts, dated = posts.filter((p) => p.date);
  const upcoming = dated.filter((p) => p.date >= today && p.date <= addDays(7) && p.status !== "idea" && p.status !== "posted").length;
  $("#calNudge").innerHTML = upcoming ? "" : '<div class="banner"><span>Nothing planned for the next 7 days. Add a post, or give one of your ideas a date.</span></div>';
  const inMonth = dated.filter((p) => p.date.slice(0, 7) === ms.slice(0, 7));
  $("#calStats").innerHTML = `
    <div class="stat"><div class="k">Planned in ${esc(new Date(y, m, 1).toLocaleDateString("en-GB", { month: "short" }))}</div><div class="v">${inMonth.filter((p) => !["posted", "idea"].includes(p.status)).length}</div></div>
    <div class="stat"><div class="k">Posted</div><div class="v">${inMonth.filter((p) => p.status === "posted").length}</div></div>
    <div class="stat"><div class="k">Ideas waiting</div><div class="v">${posts.filter((p) => p.status === "idea" || !p.date).length}</div></div>`;
  $("#calTitle").textContent = monthLabel(ms);

  const first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7;
  const days = new Date(y, m + 1, 0).getDate(), rows = Math.ceil((offset + days) / 7);
  const byDate = {}, due = {};
  dated.forEach((p) => { (byDate[p.date] = byDate[p.date] || []).push(p); });
  state.projects.filter(activeDeadline).forEach((p) => { (due[p.due] = due[p.due] || []).push(p); });
  const dow = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<div class="dow">${d}</div>`).join("");
  let cells = "";
  for (let i = 0; i < rows * 7; i++) {
    const d = new Date(y, m, 1 - offset + i), iso = isoLocal(d), ps = byDate[iso] || [], ds = due[iso] || [];
    const chips = ps.map((p) => `<span class="chipc" data-p="${esc(p.platform)}" ${p.status === "posted" ? 'data-done="1"' : ""}>${esc(p.title || "Untitled")}</span>`)

      <div class="f wide"><label for="po-tags">Hashtags</label><input id="po-tags" data-pf="hashtags" value="${esc(p.hashtags)}" placeholder="#srilanka #travel"></div>
      <div class="f wide"><label for="po-notes">Notes, shot list, location</label><textarea id="po-notes" data-pf="notes">${esc(p.notes)}</textarea></div>
    </div>
    ${ui.hasSample ? '<div class="toolbar"><button class="btn small" data-pa="ai">Suggest a caption and hashtags</button><span class="muted" id="aiMsg"></span></div>' : ""}
    <div id="sugBox"></div></div>`;
  updateCapCount(p);
}

function updateCapCount(p) {
  const el = $("#capCount"); if (!el) return;
  const lim = { Instagram: 2200, TikTok: 2200, Facebook: 63206, YouTube: 5000, LinkedIn: 3000 }[p.platform];
  el.textContent = (p.caption || "").length + (lim ? " / " + lim.toLocaleString("en-US") : "");
}

function openPost(id) {
  ui.postId = id;
  const p = state.posts.find((x) => x.id === id);
  if (p && p.date) { ui.calDay = p.date; ui.calMonth = monthStart(p.date); }
  renderCalendar(); renderPostEditor();
  const h = $("#postEditor"); if (h && h.firstElementChild) h.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function newPost(date) {
  const p = { id: uid(), date: date === undefined ? (ui.calDay || todayISO()) : date, title: "", platform: ui.lastPlatform || "Instagram", format: "Post", status: "planned", client: "", caption: "", hashtags: "", notes: "" };
  state.posts.push(p); save(); openPost(p.id);
  const t = $("#po-title"); if (t) t.focus();
}

async function suggestCaption(p) {
  const msg = $("#aiMsg"), box = $("#sugBox");
  if (!p.title && !p.notes) { if (msg) msg.textContent = "Add a title or notes first."; return; }
  let sample = null;
  try { sample = await window.claude.use("sample"); } catch (e) { sample = null; }
  if (!sample) { if (msg) msg.textContent = "Suggestions are not available in this view."; return; }
  if (msg) msg.textContent = "Thinking…";
  try {
    const out = await sample.json(
      `Write a social media caption for a creative studio in Sri Lanka.\nBrand: ${state.settings.brand || "a creative studio"}\nPlatform: ${p.platform}\nFormat: ${p.format}\nTitle: ${p.title}\nNotes: ${p.notes}\n${p.client ? "This is for a client: " + p.client + "\n" : ""}\nReturn ONLY JSON: {"caption": string of 1 to 3 short sentences with a call to action, "hashtags": array of 6 to 10 relevant hashtags each starting with #}. Keep it natural, no more than one emoji.`,
      { modelTier: "quick" });
    const cap = String((out && out.caption) || "").trim(), tags = (Array.isArray(out && out.hashtags) ? out.hashtags : []).map(String).filter((t) => t.startsWith("#")).slice(0, 12).join(" ");
    if (!cap) { if (msg) msg.textContent = "No suggestion came back. Try adding more detail."; return; }
    ui.sug = { id: p.id, cap, tags };
    if (box) box.innerHTML = `<div class="sug"><div>${esc(cap)}</div><div class="muted">${esc(tags)}</div><div class="toolbar"><button class="btn small primary" data-pa="useSug">Use this</button></div></div>`;
    if (msg) msg.textContent = "";
  } catch (e) {
    if (msg) msg.textContent = e && e.code === "not_granted" ? "Suggestions need your permission to run." : "Could not get a suggestion. Write it by hand.";
  }
}

function wireCalendar() {
  const pane = $("#pane-calendar");
  const cur = () => state.posts.find((x) => x.id === ui.postId);
  pane.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "newPost") return newPost();
    if (b.id === "calPrev" || b.id === "calNext") { ui.calMonth = shiftMonth(ui.calMonth, b.id === "calPrev" ? -1 : 1); renderCalendar(); return; }
    if (b.id === "calToday") { ui.calMonth = monthStart(todayISO()); ui.calDay = todayISO(); renderCalendar(); return; }
    if (b.dataset.day) { ui.calDay = b.dataset.day; ui.calMonth = monthStart(b.dataset.day); renderCalendar(); return; }
    if (b.dataset.cal === "addDay") return newPost(ui.calDay);
    if (b.dataset.post) return openPost(b.dataset.post);
    if (b.dataset.proj) { switchTab("pipeline"); openProject(b.dataset.proj); return; }
    const p = cur(); const a = b.dataset.pa; if (!p || !a) return;
    if (a === "close") { ui.postId = null; renderCalendar(); renderPostEditor(); }
    if (a === "copy") {
      const text = [p.caption, p.hashtags].filter(Boolean).join("\n\n");
      if (!text) { toast("Write a caption first."); return; }
      navigator.clipboard.writeText(text).then(() => toast("Caption copied"), () => toast("Copy was blocked here. Select the text and copy it."));
    }
    if (a === "dup") {
      const base = p.date || todayISO(), d = new Date(base + "T00:00:00"); d.setDate(d.getDate() + 7);
      const c = Object.assign({}, p, { id: uid(), date: isoLocal(d), status: "planned" });
      state.posts.push(c); save(); openPost(c.id); toast("Copied to next week");
    }
    if (a === "del") {
      if (b.dataset.sure) { state.posts = state.posts.filter((x) => x.id !== p.id); ui.postId = null; save(); renderCalendar(); renderPostEditor(); toast("Post deleted"); }
      else { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; }
    }
    if (a === "ai") suggestCaption(p);
    if (a === "useSug" && ui.sug && ui.sug.id === p.id) {
      p.caption = ui.sug.cap; p.hashtags = ui.sug.tags; save(); renderPostEditor(); renderCalendar(); toast("Caption added");
    }
  });
  pane.addEventListener("input", (e) => {
    const f = e.target.dataset && e.target.dataset.pf; if (!f) return;
    const p = cur(); if (!p) return;
    p[f] = e.target.value; save();
    if (f === "title") { const h = $("#postEditor h3"); if (h) h.textContent = p.title || "New post"; }
    if (f === "platform") ui.lastPlatform = p.platform;
    if (f === "caption" || f === "platform") updateCapCount(p);
    if (["title", "date", "platform", "status", "client"].includes(f)) {
      if (f === "date" && p.date) { ui.calDay = p.date; ui.calMonth = monthStart(p.date); }
      renderCalendar();
    }
  });
}
/* ---------- clients ---------- */
function waLink(phone, text) {
  let d = String(phone || "").replace(/[^\d+]/g, "").replace(/\+/g, "");
  if (!d) return "";
  if (d.startsWith("00")) d = d.slice(2);
  else if (d.startsWith("0")) d = "94" + d.slice(1);
  else if (d.length === 9) d = "94" + d;
  if (d.length < 10) return "";
  return "https://wa.me/" + d + (text ? "?text=" + encodeURIComponent(text) : "");
}
const sameName = (a, b) => String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
const clientByName = (n) => (String(n || "").trim() ? state.clients.find((c) => sameName(c.name, n)) : null);

function renderClientList() {
  const dl = $("#clientList"); if (!dl) return;
  dl.innerHTML = state.clients.filter((c) => c.name).map((c) => `<option value="${esc(c.name)}">`).join("");
}

function clientStats(c) {
  const projects = state.projects.filter((p) => sameName(p.client, c.name));
  const docs = state.invoices.filter((i) => sameName(i.client, c.name));
  const by = {};
  docs.filter((d) => d.kind === "invoice" && d.status === "sent").forEach((d) => { const k = curOf(d); by[k] = (by[k] || 0) + invBal(d); });
  const owedText = Object.entries(by).filter(([, v]) => v > 0).map(([k, v]) => money(v, 0, k)).join(" + ");
  return { projects, docs, owedText: owedText ? owedText + " owed" : "" };
}

function unlistedNames() {
  const names = new Map();
  [...state.projects, ...state.invoices].forEach((x) => {
    const n = String(x.client || "").trim();
    if (n && !clientByName(n) && !names.has(n.toLowerCase())) names.set(n.toLowerCase(), n);
  });
  return [...names.values()];
}

function wireClients() {
  const pane = $("#pane-clients");
  const cur = () => state.clients.find((x) => x.id === ui.clientId);
  pane.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "newClient") {
      const c = { id: uid(), name: "", phone: "", email: "", notes: "" };
      state.clients.push(c); ui.clientId = c.id; save(); renderClients();
      const n = $("#cl-name"); if (n) n.focus(); return;
    }
    if (b.id === "importClients") {
      unlistedNames().forEach((n) => state.clients.push({ id: uid(), name: n, phone: "", email: "", notes: "" }));
      save(); renderClients(); renderClientList(); toast("Client names saved"); return;
    }
    if (b.dataset.client) { ui.clientId = b.dataset.client; renderClients(); return; }
    if (b.dataset.cproj) { switchTab("pipeline"); openProject(b.dataset.cproj); return; }
    if (b.dataset.cdoc) { switchTab("invoices"); openInvoice(b.dataset.cdoc); return; }
    const c = cur(); const a = b.dataset.cact; if (!c || !a) return;
    if (a === "estimate") {
      state.estimate.client = c.name; save(); switchTab("estimate");
      const el = $("#estClient"); if (el) el.value = c.name;
    }
    if (a === "invoice") createDoc("invoice", { client: c.name, currency: state.settings.currency });
    if (a === "del") {
      if (b.dataset.sure) { state.clients = state.clients.filter((x) => x.id !== c.id); ui.clientId = null; save(); renderClients(); renderClientList(); toast("Client deleted"); }
      else { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; }
    }
  });
  pane.addEventListener("input", (e) => {
    const t = e.target; const c = cur(); if (!c || !t.dataset.c) return;
    c[t.dataset.c] = t.value; save();
    if (t.dataset.c === "name") { const h = $("#clientEditor h3"); if (h) h.textContent = c.name || "New client"; renderClientRows(); renderClientList(); }
  });
  pane.addEventListener("change", (e) => {
    const t = e.target; const c = cur(); if (!c || !t.dataset.c) return;
    if (t.dataset.c === "name") {
      const old = (t.dataset.old || "").trim(), nw = c.name.trim();
      if (old && nw && !sameName(old, nw)) {
        state.projects.forEach((p) => { if (sameName(p.client, old)) p.client = nw; });
        state.invoices.forEach((i) => { if (sameName(i.client, old)) i.client = nw; });
        if (sameName(state.estimate.client, old)) { state.estimate.client = nw; const el = $("#estClient"); if (el) el.value = nw; }
      }
      t.dataset.old = nw;
    }
    save(); renderClientEditor(); renderClientRows(); renderClientList();
  });
}

function invStatusPill(inv) {
  if (isOverdue(inv)) return '<span class="pill bad">Overdue</span>';
  if (inv.kind === "invoice" && inv.status !== "paid" && invPaid(inv) > 0) return '<span class="pill warn">Part paid</span>';
  const map = { draft: ["", "Draft"], sent: ["info", "Sent"], paid: ["good", "Paid"] };
  const m = map[inv.status] || ["", inv.status];
  if (inv.kind === "quote" && inv.status === "paid") return '<span class="pill good">Accepted</span>';
  return `<span class="pill ${m[0]}">${esc(m[1])}</span>`;
}

}

function refreshTotals(inv) {

}

function docText(inv) {
  const s = state.settings;
  const lines = [`${inv.kind === "quote" ? "QUOTE" : "INVOICE"} ${docNo(inv.kind, inv.no)}`, s.brand, "", `Bill to: ${inv.client}`, `Date: ${fmtDate(inv.date)}`, `${inv.kind === "quote" ? "Valid until" : "Due"}: ${fmtDate(inv.due)}`, ""];
  inv.items.forEach((it) => lines.push(`${it.desc} — ${it.qty} × ${it.rate} = ${(num(it.qty) * num(it.rate)).toFixed(2)}`));
  lines.push("", `Total: ${dm(inv, invGrand(inv), 2)}`);
  if (inv.kind === "invoice" && invPaid(inv) > 0) lines.push(`Paid: ${dm(inv, invPaid(inv), 2)}`, `Balance due: ${dm(inv, invBal(inv), 2)}`);
  if (s.paymentInfo) lines.push("", "Payment details:", s.paymentInfo);
  if (inv.notes) lines.push("", inv.notes);
  return lines.join("\n");
}

function wireInvoices() {
  const pane = $("#pane-invoices");
  const cur = () => state.invoices.find((x) => x.id === ui.invoiceId);
  pane.addEventListener("click", async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "newInvoice") return createDoc("invoice");
    if (b.id === "newQuote") return createDoc("quote");
    if (b.dataset.inv) return openInvoice(b.dataset.inv);
    const inv = cur(); const act = b.dataset.act; if (!inv || !act) return;
    if (act === "addItem") { inv.items.push({ desc: "", qty: 1, rate: 0 }); save(); $("#itemBody").innerHTML = itemRows(inv); refreshTotals(inv); }
    if (act === "delItem") {
      inv.items.splice(+b.dataset.i, 1); if (!inv.items.length) inv.items.push({ desc: "", qty: 1, rate: 0 });
      save(); $("#itemBody").innerHTML = itemRows(inv); refreshTotals(inv);
    }
    if (act === "delInv") {
      if (b.dataset.sure) { state.invoices = state.invoices.filter((x) => x.id !== inv.id); ui.invoiceId = null; save(); renderInvList(); renderInvEditor(); renderPipeline(); toast("Deleted"); }
      else { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; }
    }
    if (act === "copy") {
      try { await navigator.clipboard.writeText(docText(inv)); toast("Copied to clipboard"); }
      catch (err) { toast("Copy was blocked here. Use Save PDF instead."); }
    }
    if (act === "toInvoice") {
      createDoc("invoice", { client: inv.client, items: JSON.parse(JSON.stringify(inv.items)), projectId: inv.projectId, currency: curOf(inv) });
      const n = cur(); if (n) { n.discount = inv.discount; n.taxPct = inv.taxPct; n.email = inv.email; save(); renderInvEditor(); refreshTotals(n); }
      inv.status = "paid"; save(); renderInvList();
    }
    if (act === "pdf") savePdf(inv);
    if (act === "addPay" || act === "deposit") addPayment(inv, act === "deposit");
    if (act === "delPay") { (inv.payments || []).splice(+b.dataset.i, 1); afterPay(inv, true); }
  });
  pane.addEventListener("input", (e) => {
    const inv = cur(); if (!inv) return; const t = e.target;
    if (t.dataset.f) {
      inv[t.dataset.f] = ["taxPct", "discount"].includes(t.dataset.f) ? num(t.value) : t.value; save(); refreshTotals(inv);
      if (t.dataset.f === "client" && !inv.email) { const c = clientByName(inv.client); if (c && c.email) { inv.email = c.email; const em = $("#if-email"); if (em) em.value = c.email; } }
    }
    else if (t.dataset.it) {
      const tr = t.closest("tr"); const it = inv.items[+tr.dataset.i];
      it[t.dataset.it] = t.dataset.it === "desc" ? t.value : num(t.value);
      tr.querySelector("[data-line]").textContent = (num(it.qty) * num(it.rate)).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      save(); refreshTotals(inv);
    }
  });
  pane.addEventListener("change", (e) => {
    const t = e.target; const inv = cur();
    if (t.id === "kindFilter") { ui.kind = t.value; renderInvList(); }
    if (t.dataset.f === "status" && inv) { save(); renderInvList(); renderPipeline(); renderInvEditor(); }
    if (t.id === "svcPick" && inv && t.value) {
      const s = state.settings.services.find((x) => x.id === t.value);
      if (s) {
        const empty = inv.items.length === 1 && !inv.items[0].desc && !num(inv.items[0].rate);
        const line = { desc: s.pkg && s.inc ? s.name + " — " + s.inc.join(", ") : s.name, qty: 1, rate: num(curOf(inv) === "USD" ? s.usd : s.rate) };
        if (empty) inv.items[0] = line; else inv.items.push(line);
        save(); $("#itemBody").innerHTML = itemRows(inv); refreshTotals(inv); t.value = "";
      }
    }
  });
}
/* ---------- payments received on an invoice ---------- */
function renderPayBox(inv) {
  const box = $("#payBox"); if (!box) return;
  if (inv.kind !== "invoice") { box.innerHTML = ""; return; }
  const pays = inv.payments || [], pct = num(state.settings.depositPct);
  box.innerHTML = `<div class="pays"><h4 class="grp">Payments received</h4>
    ${pays.map((p, i) => `<div class="pay"><span>${esc(fmtDate(p.date))}${p.note ? " · " + esc(p.note) : ""}</span>
      <span class="mono">${esc(dm(inv, p.amount, 2))} <button class="btn small quiet" data-act="delPay" data-i="${i}" aria-label="Remove payment">✕</button></span></div>`).join("")
      || '<div class="empty">No payments recorded yet.</div>'}
    <div class="payform">
      <div class="f"><label for="pay-amt">Amount (${esc(curOf(inv))})</label><input id="pay-amt" type="number" min="0" step="any"></div>
      <div class="f"><label for="pay-date">Date</label><input id="pay-date" type="date" value="${esc(todayISO())}"></div>
      <div class="f"><label for="pay-note">Note</label><input id="pay-note" placeholder="Bank transfer, cash…"></div>
    </div>
    <div class="toolbar"><button class="btn small primary" data-act="addPay">Record payment</button>
      ${pct > 0 ? `<button class="btn small" data-act="deposit">Record ${esc(pct)}% deposit (${esc(dm(inv, invGrand(inv) * pct / 100, 2))})</button>` : ""}</div></div>`;
}

function afterPay(inv, removed) {
  const rem = invGrand(inv) - invPaid(inv);
  if (rem <= 0 && invGrand(inv) > 0) inv.status = "paid";
  else if (removed && inv.status === "paid") inv.status = "sent";
  else if (inv.status === "draft" && invPaid(inv) > 0) inv.status = "sent";
  save(); renderInvEditor(); refreshTotals(inv);
}

function addPayment(inv, deposit) {
  let amt, note = "";
  if (deposit) { amt = Math.round(invGrand(inv) * num(state.settings.depositPct)) / 100; note = state.settings.depositPct + "% deposit"; }
  else { amt = num($("#pay-amt").value); note = $("#pay-note").value.trim(); }
  if (!(amt > 0)) { toast("Enter an amount first."); return; }
  const date = (!deposit && $("#pay-date").value) || todayISO();
  (inv.payments = inv.payments || []).push({ id: uid(), date, amount: amt, note });
  afterPay(inv, false);
  toast("Payment recorded");
}

/* ---------- PDF ---------- */
async function savePdf(inv) {
  const lib = window.jspdf;
  if (!lib) { toast("The PDF tool did not load. Use Copy text instead."); return; }
  const s = state.settings, doc = new lib.jsPDF({ unit: "mm", format: "a4" });
  const L = 18, R = 192; let y = 22;
  const cur = (n) => curOf(inv) + " " + num(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); try { doc.addImage(LOGO_BLACK, "PNG", L, 14, 19, 19); } catch (e) { /* logo is optional */ }
  doc.text(s.brand || "Your Studio", L + 23, y);
  doc.setFontSize(20); doc.text(inv.kind === "quote" ? "QUOTE" : "INVOICE", R, y, { align: "right" });
  y += 7; doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
  [s.address, s.email, s.phone].filter(Boolean).forEach((t) => { doc.text(String(t), L + 23, y); y += 5; });
  doc.text(docNo(inv.kind, inv.no), R, 29, { align: "right" });
  doc.text("Date: " + fmtDate(inv.date), R, 34, { align: "right" });
  doc.text((inv.kind === "quote" ? "Valid until: " : "Due: ") + fmtDate(inv.due), R, 39, { align: "right" });
  y = Math.max(y, 46) + 6; doc.setTextColor(0);
  doc.setFont("helvetica", "bold"); doc.text("Bill to", L, y); y += 5;
  doc.setFont("helvetica", "normal"); doc.text(inv.client || "-", L, y); if (inv.email) { y += 5; doc.text(inv.email, L, y); }
  y += 12; doc.setFont("helvetica", "bold"); doc.setFontSize(9);
  doc.text("DESCRIPTION", L, y); doc.text("QTY", 118, y, { align: "right" }); doc.text("RATE", 152, y, { align: "right" }); doc.text("AMOUNT", R, y, { align: "right" });
  y += 2; doc.setDrawColor(180); doc.line(L, y, R, y); y += 6; doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  inv.items.forEach((it) => {
    const lines = doc.splitTextToSize(it.desc || "-", 80);
    if (y + lines.length * 5 > 270) { doc.addPage(); y = 22; }
    doc.text(lines, L, y);
    doc.text(String(it.qty), 118, y, { align: "right" }); doc.text(cur(it.rate), 152, y, { align: "right" });
    doc.text(cur(num(it.qty) * num(it.rate)), R, y, { align: "right" }); y += lines.length * 5 + 2;
  });
  y += 2; doc.line(L, y, R, y); y += 7;
  const tot = (label, val, bold) => { doc.setFont("helvetica", bold ? "bold" : "normal"); doc.text(label, 140, y); doc.text(val, R, y, { align: "right" }); y += 6; };
  tot("Subtotal", cur(invTotal(inv)));
  if (num(inv.taxPct)) tot("Tax (" + inv.taxPct + "%)", cur(invTax(inv)));
  if (num(inv.discount)) tot("Discount", "-" + cur(inv.discount));
  doc.setFontSize(12); tot("Total", cur(invGrand(inv)), true); doc.setFontSize(10);
  if (inv.kind === "invoice" && invPaid(inv) > 0) {
    tot("Paid", "-" + cur(invPaid(inv)));
    doc.setFontSize(12); tot("Balance due", cur(invBal(inv)), true); doc.setFontSize(10);
  }
  if (inv.kind === "quote" && num(s.depositPct) > 0) {
    doc.setFont("helvetica", "normal"); doc.setTextColor(90);
    doc.text("To confirm: " + s.depositPct + "% deposit (" + cur(invGrand(inv) * num(s.depositPct) / 100) + ")", R, y, { align: "right" });
    y += 6; doc.setTextColor(0);
  }
  const block = (title, text) => {
    const ls = doc.splitTextToSize(text, R - L);
    if (y + 10 + ls.length * 5 > 280) { doc.addPage(); y = 22; }
    y += 5; doc.setFont("helvetica", "bold"); doc.setTextColor(0); doc.text(title, L, y); y += 5;
    doc.setFont("helvetica", "normal"); doc.setTextColor(90); doc.text(ls, L, y); y += ls.length * 5;
  };
  if (s.paymentInfo) block("Payment details", s.paymentInfo);
  if (inv.notes) block("Notes", inv.notes);
  await deliverPdf(doc, docNo(inv.kind, inv.no) + ".pdf");
}

async function saveBlob(blob, filename, okMsg) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast(okMsg); }
    catch (err) { if (!err || err.code !== "declined") toast("Could not save the file here."); }
    return;
  }
  try {
    const a = document.createElement("a"), url = URL.createObjectURL(blob);
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast(okMsg);
  } catch (e) { toast("Could not save the file here."); }
}
const deliverPdf = (doc, filename) => saveBlob(doc.output("blob"), filename, "PDF ready");

/* ---------- price list PDF (current price list: local LKR or international USD) ---------- */
async function savePriceList() {
  const lib = window.jspdf;
  if (!lib) { toast("The PDF tool did not load. Try again in a moment."); return; }
  const intl = isIntl(), cur = intl ? "USD" : (state.settings.currency || "LKR");
  const price = (v) => (intl ? num(v.usd) : num(v.rate));
  const fmt = (n) => cur + " " + num(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const s = state.settings, doc = new lib.jsPDF({ unit: "mm", format: "a4" });
  const L = 18, R = 192, BOTTOM = 280, line = intl ? [10, 118, 180] : [253, 102, 4];
  let y = 22;
  const ensure = (h) => { if (y + h > BOTTOM) { doc.addPage(); y = 22; } };

  try { doc.addImage(LOGO_BLACK, "PNG", L, 14, 19, 19); } catch (e) { /* logo is optional */ }
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(0);
  doc.text(s.brand || "Your Studio", L + 23, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
  let hy = y + 7;
  [s.address, s.email, s.phone].filter(Boolean).forEach((t) => { doc.text(String(t), L + 23, hy); hy += 5; });
  doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(0); doc.text("RATE CARD", R, y, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
  doc.text("Prices in " + cur, R, 29, { align: "right" });
  if (s.validUntil) doc.text("Valid until " + s.validUntil, R, 34, { align: "right" });
  y = Math.max(hy, 42) + 8; doc.setTextColor(0);

  const heading = (t) => {
    ensure(26); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(0);
    doc.text(t.toUpperCase(), L, y); y += 2; doc.setDrawColor(line[0], line[1], line[2]); doc.setLineWidth(0.6); doc.line(L, y, R, y); y += 7;
  };
  const row = (name, val, note, shade) => {
    const ls = doc.splitTextToSize(name, 128), h = ls.length * 5 + (note ? 4 : 0) + 3;
    ensure(h);
    if (shade) { doc.setFillColor(244, 245, 245); doc.rect(L, y - 4, R - L, h, "F"); }
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(0); doc.text(ls, L + 2, y);
    doc.setFont("helvetica", "bold"); doc.text(val, R - 2, y, { align: "right" });
    if (note) { doc.setFont("helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(110); doc.text(note, L + 2, y + ls.length * 5 - 1); }
    y += h;
  };

  const pk = s.services.filter((v) => v.pkg);
  if (pk.length) {
    heading("Packages");
    pk.forEach((p) => {
      const inc = doc.splitTextToSize((p.inc || []).join("; "), 128);
      ensure(inc.length * 4 + 14);
      doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(0);
      doc.text(p.name, L + 2, y); doc.text(fmt(price(p)), R - 2, y, { align: "right" }); y += 5;
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(100); doc.text(inc, L + 2, y);
      y += inc.length * 4 + 2; doc.setDrawColor(222); doc.setLineWidth(0.2); doc.line(L, y, R, y); y += 6;
    });
    y += 2;
  }
  const cats = []; s.services.filter((v) => !v.pkg).forEach((v) => { const c = v.cat || "Other"; if (!cats.includes(c)) cats.push(c); });
  cats.forEach((c) => {
    heading(c);
    s.services.filter((v) => !v.pkg && (v.cat || "Other") === c).forEach((v, i) => row(v.name, fmt(price(v)), v.note, i % 2 === 1));
    y += 5;
  });
  if (intl) { ensure(12); doc.setFont("helvetica", "italic"); doc.setFontSize(8.5); doc.setTextColor(110); doc.text("International prices are in US dollars.", L, y); }

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(120);
    doc.text((s.brand || "") + "  |  Rate card" + (s.validUntil ? "  |  Valid until " + s.validUntil : "") + "  |  Page " + i + " of " + n, 105, 290, { align: "center" });
  }
  const base = String(s.brand || "Rate-Card").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
  await deliverPdf(doc, base + "-Rate-Card-" + cur + ".pdf");
}

function switchTab(name) {
  ui.tab = name;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  ["estimate", "pipeline", "calendar", "clients", "invoices", "settings"].forEach((n) => { $("#pane-" + n).hidden = n !== name; });
  if ($("#estBar")) renderEstimate();
  if (name === "clients" && $("#clientRows")) renderClients();
  if (name === "calendar") renderCalendar();
}

function renderAll() {
  brandName();
  renderEstimate();
  renderClientList(); renderClients();
  renderPipeline(); renderProjectEditor();
  renderCalendar(); renderPostEditor();
  renderInvList(); renderInvEditor();
  renderSettings();
}

document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => switchTab(t.dataset.tab)));
wireEstimate(); wirePipeline(); wireCalendar(); wireClients(); wireInvoices(); wireSettings();
$("#brandLogo").src = LOGO_ORANGE;
$("#pane-estimate").innerHTML = '<div class="empty">Loading your rate card…</div>';

(async function boot() {
  await Promise.race([initStore(), new Promise((r) => setTimeout(r, 6000))]);
  if (!state) { const saved = lsRead(); if (!adopt(saved)) state = exampleState(); store.mode = store.mode === "db" ? "db" : "local"; setNote("Saved in this browser only."); }
  buildEstimate(); buildPipeline(); buildCalendar(); buildClients(); buildInvoices();
  renderAll();
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body></html>
