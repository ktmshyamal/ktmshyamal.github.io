<div class="app">
  <aside class="rail">
    <div class="brand">
      <img class="logo" id="brandLogo" alt="" width="44" height="44">
      <div><h1 id="brandName">Creator Hub</h1><p>Clients · Quotes · Invoices</p></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-estimate" data-tab="estimate" aria-selected="true">Estimate</button>
      <button class="tab" role="tab" id="tab-pipeline" data-tab="pipeline" aria-selected="false">Projects <span class="count" id="cnt-pipeline"></span></button>
      <button class="tab" role="tab" id="tab-calendar" data-tab="calendar" aria-selected="false">Calendar</button>
      <button class="tab" role="tab" id="tab-clients" data-tab="clients" aria-selected="false">Clients</button>
      <button class="tab" role="tab" id="tab-invoices" data-tab="invoices" aria-selected="false">Invoices <span class="count" id="cnt-invoices"></span></button>
      <button class="tab" role="tab" id="tab-settings" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
    <div class="syncnote" id="syncNote">Loading your data…</div>
  </aside>

  <main>
    <section class="pane" id="pane-estimate" aria-labelledby="tab-estimate"></section>
    <section class="pane" id="pane-pipeline" aria-labelledby="tab-pipeline" hidden></section>
    <section class="pane" id="pane-calendar" aria-labelledby="tab-calendar" hidden></section>
    <section class="pane" id="pane-clients" aria-labelledby="tab-clients" hidden></section>
    <section class="pane" id="pane-invoices" aria-labelledby="tab-invoices" hidden></section>
    <section class="pane" id="pane-settings" aria-labelledby="tab-settings" hidden></section>
  </main>
</div>
<datalist id="clientList"></datalist>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
