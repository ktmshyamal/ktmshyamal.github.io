<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f5f9">
<title>Page not found · Gayan Shyamal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{--bg:#f7f5f9;--surface:#fff;--ink:#271d31;--muted:#655c74;--accent:#f0a35a;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;
  display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
main{width:min(560px,100%);text-align:center;padding:48px 0}
img{width:auto;height:52px;margin:0 auto 32px;display:block}
p.code{margin:0 0 10px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-weight:500;font-size:clamp(36px,7vw,56px);line-height:1.02;letter-spacing:-.04em;text-wrap:balance}
h1 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
p.body{margin:18px auto 30px;max-width:38ch;color:var(--muted)}
a.pill{display:inline-flex;align-items:center;gap:12px;padding:7px 20px 7px 7px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:500}
a.pill span{width:32px;height:32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--ink)}
a.pill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/brand/logo-ink.png" alt="Gayan Shyamal" width="253" height="200">
  <p class="code">Error 404</p>
  <h1>This page went <em>off the trail</em></h1>
  <p class="body">The address may be mistyped, or the page has moved. The full portfolio is one click away.</p>
  <a class="pill" href="/"><span aria-hidden="true">←</span>Back to the portfolio</a>
</main>
</body>
</html>
